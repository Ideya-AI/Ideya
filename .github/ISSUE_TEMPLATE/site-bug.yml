name: Site bug
description: Something on ideya1.org is broken or looks wrong.
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The link where it happens.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: e.g. iPhone 15, Safari
