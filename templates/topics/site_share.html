{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ideya — Share Card</title>
<link rel="stylesheet" href="{% static 'css/fonts.css' %}" />
<link rel="stylesheet" href="{% static 'vendor/phosphor-duotone.css' %}" />
<link rel="stylesheet" href="{% static 'css/tokens.css' %}" />
<style>
  *{box-sizing:border-box} html,body{margin:0}
  body{background:#e7eae6;font-family:var(--font-sans);-webkit-font-smoothing:antialiased;padding:44px;display:flex;justify-content:center}
  body.card-only{padding:0;background:#fff;display:block}
  body.card-only .card{position:static;box-shadow:none}

  .card{width:1200px;height:630px;flex:none;background:#fff;color:var(--ink-900);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:62px 72px;box-shadow:0 20px 60px -24px rgba(20,22,15,.4)}
  .card::before{content:"";position:absolute;right:-140px;top:-140px;width:460px;height:460px;border-radius:9999px;background:var(--green-tint);opacity:.6}
  .card>*{position:relative}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .mark{height:34px;width:auto;border-radius:8px}
  .brand .wm{font-weight:800;font-size:26px;letter-spacing:-.03em}
  .kicker{align-self:flex-start;display:inline-flex;align-items:center;gap:9px;margin-top:40px;font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-strong);background:var(--green-tint);border-radius:9999px;padding:8px 18px}
  .kicker i{font-size:19px}
  .headline{margin:26px 0 0;font-weight:800;font-size:62px;letter-spacing:-.035em;line-height:1.04;max-width:16ch}
  .headline .hl{color:var(--accent-strong)}
  .desc{margin:24px 0 0;font-size:27px;line-height:1.4;color:var(--ink-600);max-width:40ch;text-wrap:pretty}
  .foot{margin-top:auto;display:flex;align-items:flex-start;gap:18px;padding-top:24px;border-top:1px solid var(--ink-100)}
  .cchips{display:flex;gap:8px;flex-wrap:wrap;overflow:hidden;max-height:118px}
  .cchip{display:inline-flex;align-items:center;gap:7px;font-size:14.5px;font-weight:600;color:var(--ink-700);background:var(--ink-50);border:1px solid var(--ink-100);border-radius:9999px;padding:5px 12px;white-space:nowrap}
  .cchip .dot{width:9px;height:9px;border-radius:9999px;flex:none}
</style>
</head>
<body{% if render_card %} class="card-only"{% endif %}>
  <div class="card">
    <div class="brand"><img class="mark" src="{% static 'img/ideya-mark.png' %}" alt="" /><span class="wm">Ideya</span></div>
    <span class="kicker"><i class="ph-duotone ph-infinity"></i>The project</span>
    <h1 class="headline">Make the shape of hard issues <span class="hl">legible.</span></h1>
    <p class="desc">Every topic on one page: the shared facts, the strongest case for every position, and the crux where the disagreement actually lives.</p>
    <div class="foot">
      <div class="cchips">
        {% for cat in categories %}<span class="cchip"><span class="dot" style="background:{{ cat.color_var }}"></span>{{ cat.name }}</span>{% endfor %}
      </div>
    </div>
  </div>
</body>
</html>
