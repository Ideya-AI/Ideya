{% comment %}Question importance control — upvote only (downvotes retired
2026-08-01). POST casts; the same participant again retracts. HTMX-swapped.
Expects `q` with `.user_vote` (1 or 0) and `.votes` (upvote count).{% endcomment %}
<div class="qvote" id="qvote-{{ q.id }}">
  <button type="button" class="vbtn"
    hx-post="{% url 'topics:vote' 'question' q.id %}" hx-vals='{"dir": "up"}'
    hx-target="#qvote-{{ q.id }}" hx-swap="outerHTML" hx-sync="#qvote-{{ q.id }}:replace"
    aria-label="Upvote this question" aria-pressed="{% if q.user_vote == 1 %}true{% else %}false{% endif %}">
    <i class="ph-{% if q.user_vote == 1 %}fill ph-caret-up up{% else %}duotone ph-caret-up{% endif %}"></i>
  </button>
  <span class="qc">{% if q.votes %}{{ q.votes }}{% endif %}</span>
</div>
