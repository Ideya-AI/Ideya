{% comment %}Question importance control — a toggle: vote, click again to
retract. HTMX-swapped on vote. Expects `q` (with .voted).{% endcomment %}
<div class="qvote" id="qvote-{{ q.id }}">
  <button type="button" class="vbtn"
    hx-post="{% url 'topics:vote' 'question' q.id %}" hx-target="#qvote-{{ q.id }}" hx-swap="outerHTML" hx-sync="#qvote-{{ q.id }}:replace"
    aria-label="{% if q.voted %}Retract your importance vote{% else %}Mark this question important{% endif %}"
    aria-pressed="{% if q.voted %}true{% else %}false{% endif %}">
    <i class="ph-{% if q.voted %}fill ph-caret-up up{% else %}duotone ph-caret-up{% endif %}"></i>
  </button>
  <span class="qc">{{ q.votes }}</span>
  <i class="ph-duotone ph-caret-down"></i>
</div>
