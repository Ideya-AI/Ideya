{% load static %}<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{% block title %}Infinity Project{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            ink: {
              50:  '#f8f8f7',
              100: '#eeeeec',
              200: '#d9d9d4',
              400: '#8a8a83',
              600: '#4a4a44',
              900: '#1a1a18',
            },
          },
          maxWidth: {
            prose: '68ch',
          },
        },
      },
    };
  </script>

  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>

  <style>
    html { -webkit-text-size-adjust: 100%; }
    body { font-feature-settings: "cv11", "ss01"; }
  </style>
</head>
<body class="h-full bg-ink-50 text-ink-900 font-sans antialiased">
  <header class="border-b border-ink-100">
    <div class="mx-auto max-w-5xl px-4 sm:px-6 py-4 flex items-center justify-between">
      <a href="/" class="text-lg font-semibold tracking-tight">Infinity</a>
      <nav class="text-sm text-ink-600">
        <a href="/" class="hover:text-ink-900">Topics</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 sm:px-6 py-8 sm:py-12">
    {% block content %}{% endblock %}
  </main>

  <footer class="mt-16 border-t border-ink-100">
    <div class="mx-auto max-w-5xl px-4 sm:px-6 py-6 text-xs text-ink-400">
      A curated atlas of hard issues.
    </div>
  </footer>
</body>
</html>
