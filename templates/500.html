processors, so this page depends on nothing that could itself fail.{% endcomment %}

           font-family: system-ui, sans-serif; background: #f7f9f7; color: #14160f; }
    .box { text-align: center; padding: 32px; }
    h1 { font-size: 28px; letter-spacing: -.02em; margin: 0 0 10px; }
    p { color: #5c6356; margin: 0 0 22px; }
    a { display: inline-block; background: #14160f; color: #fff; text-decoration: none;
        border-radius: 999px; padding: 11px 22px; font-weight: 600; font-size: 14px; }
  </style>
</head>
