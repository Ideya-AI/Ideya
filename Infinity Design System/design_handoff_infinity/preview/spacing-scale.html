<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--white);padding:22px 24px}
  .head{font-size:11px;color:var(--fg3);margin:0 0 14px}
  .row{display:flex;align-items:flex-end;gap:14px}
  .u{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:var(--ink-900);border-radius:2px;width:18px}
  .lab{font-size:10px;color:var(--fg3);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <p class="head">Spacing — 4px base (Tailwind scale)</p>
  <div class="row">
    <div class="u"><div class="bar" style="height:4px"></div><div class="lab">4</div></div>
    <div class="u"><div class="bar" style="height:8px"></div><div class="lab">8</div></div>
    <div class="u"><div class="bar" style="height:12px"></div><div class="lab">12</div></div>
    <div class="u"><div class="bar" style="height:16px"></div><div class="lab">16</div></div>
    <div class="u"><div class="bar" style="height:24px"></div><div class="lab">24</div></div>
    <div class="u"><div class="bar" style="height:32px"></div><div class="lab">32</div></div>
    <div class="u"><div class="bar" style="height:48px"></div><div class="lab">48</div></div>
    <div class="u"><div class="bar" style="height:56px"></div><div class="lab">56</div></div>
    <div class="u"><div class="bar" style="height:80px"></div><div class="lab">80</div></div>
  </div>
</body></html>
