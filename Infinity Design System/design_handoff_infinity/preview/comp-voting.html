<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-50);padding:20px 24px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .card{background:#fff;border:1px solid var(--ink-100);border-radius:12px;padding:14px 16px;flex:1;min-width:0}
  .h{font-size:11px;color:var(--fg3);margin:0 0 10px}
  .vote{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink-100);border-radius:9999px;padding:4px 6px}
  .vote button{all:unset;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:9999px;color:var(--fg3);cursor:pointer}
  .vote button:hover{background:var(--ink-50);color:var(--fg1)}
  .vote .count{font-size:13px;font-weight:600;color:var(--fg1);font-variant-numeric:tabular-nums;min-width:26px;text-align:center}
  svg{width:15px;height:15px}
  .ad{display:flex;gap:8px}
  .ad button{all:unset;cursor:pointer;font-size:13px;font-weight:500;padding:6px 14px;border-radius:9999px;border:1px solid var(--ink-100);color:var(--fg2)}
  .ad button.agree{border-color:var(--pos-green);color:var(--pos-green);background:color-mix(in srgb,var(--pos-green) 8%,#fff)}
</style></head>
<body>
  <div class="card">
    <p class="h">Importance — Questions &amp; Positions</p>
    <div class="vote">
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"></path></svg></button>
      <span class="count">128</span>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
    </div>
  </div>
  <div class="card">
    <p class="h">Agree / disagree — Positions</p>
    <div class="ad">
      <button class="agree">Agree</button>
      <button>Disagree</button>
    </div>
  </div>
</body></html>
