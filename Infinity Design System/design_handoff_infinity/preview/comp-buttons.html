<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:#fff;padding:20px 24px}
  .h{font-size:11px;color:var(--fg3);margin:18px 0 10px}
  .h:first-child{margin-top:0}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{font-size:14px;font-weight:500;padding:9px 18px;border-radius:9999px;cursor:pointer;border:1px solid transparent}
  .primary{background:var(--ink-900);color:#fff}
  .secondary{background:#fff;color:var(--fg1);border-color:var(--ink-200)}
  .ghost{background:transparent;color:var(--fg2)}
  .link{color:var(--fg1);font-weight:500;font-size:14px;text-decoration:underline;text-underline-offset:2px}
  .field{display:flex;align-items:center;gap:8px;background:var(--ink-50);border:1px solid var(--ink-100);border-radius:9999px;padding:10px 16px;color:var(--fg3);font-size:14px;max-width:320px}
  .field svg{width:15px;height:15px}
</style></head>
<body>
  <p class="h">Buttons</p>
  <div class="row">
    <button class="btn primary">Submit your view</button>
    <button class="btn secondary">Go further</button>
    <button class="btn ghost">Dismiss</button>
    <a class="link" href="#">source ↗</a>
  </div>
  <p class="h">Search field (pill, inset)</p>
  <div class="field">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
    <span>Search topics and categories</span>
  </div>
</body></html>
