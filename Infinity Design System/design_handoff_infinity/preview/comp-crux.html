<style>

<body>
  <p class="lbl">Crux</p>
  <div class="crux">
    <p>Strip away the rhetoric and most of the nuclear debate collapses onto a narrower disagreement: whether the West can build plants on budget and on schedule — and whether that question is empirical or values-laden.</p>
