<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--ink-50);padding:20px 24px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .a{background:#fff;border:1px solid var(--ink-100);border-radius:12px;padding:16px}
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .kind{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg3)}
  .for{font-size:12px;color:var(--fg3)}
  .title{margin-top:4px;font-size:15px;font-weight:500;color:var(--fg1)}
  .desc{margin-top:4px;font-size:13px;color:var(--fg2);line-height:1.45}
</style></head>
<body>
  <div class="grid">
    <div class="a">
      <div class="top"><span class="kind">Donate</span><span class="for">for New-Nuclear Advocate</span></div>
      <div class="title">Good Energy Collective ↗</div>
      <div class="desc">Progressive nuclear policy research. 4-star Charity Navigator.</div>
    </div>
    <div class="a">
      <div class="top"><span class="kind">Learn more</span></div>
      <div class="title">Our World in Data: Energy ↗</div>
      <div class="desc">Lifecycle emissions and death rates across all sources.</div>
    </div>
  </div>
</body></html>
