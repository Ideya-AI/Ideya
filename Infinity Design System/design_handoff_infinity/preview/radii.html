<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--white);padding:22px 24px}
  .head{font-size:11px;color:var(--fg3);margin:0 0 16px}
  .row{display:flex;gap:18px;align-items:center}
  .u{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .box{width:96px;height:60px;background:var(--ink-50);border:1px solid var(--ink-100)}
  .lab{font-size:11px;font-weight:600;color:var(--fg1)}
  .lab span{font-weight:400;color:var(--fg3)}
</style></head>
<body>
  <p class="head">Corner radii — flat surfaces, soft corners. No shadows; cards are defined by a 1px hairline.</p>
  <div class="row">
    <div class="u"><div class="box" style="border-radius:8px"></div><div class="lab">sm <span>8</span></div></div>
    <div class="u"><div class="box" style="border-radius:12px"></div><div class="lab">card <span>12</span></div></div>
    <div class="u"><div class="box" style="border-radius:16px"></div><div class="lab">lg / crux <span>16</span></div></div>
    <div class="u"><div class="box" style="border-radius:9999px;width:96px"></div><div class="lab">pill <span>∞</span></div></div>
  </div>
</body></html>
