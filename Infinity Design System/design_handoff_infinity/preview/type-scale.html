<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--white);padding:22px 24px}
  .stack{display:flex;flex-direction:column;gap:14px}
  .line{display:flex;align-items:baseline;gap:16px}
  .tag{width:120px;flex:none;font-size:10px;color:var(--fg3);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="stack">
    <div class="line"><span class="tag">Title · 36/600</span><span style="font-size:36px;font-weight:600;letter-spacing:-.02em;color:var(--fg1)">Nuclear Energy</span></div>
    <div class="line"><span class="tag">Card · 18/500</span><span style="font-size:18px;font-weight:500;letter-spacing:-.02em;color:var(--fg1)">Climate Pragmatist</span></div>
    <div class="line"><span class="tag">Stat · 24/600 tab</span><span style="font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg1)">0.03</span></div>
    <div class="line"><span class="tag">Body · 16/400</span><span style="font-size:16px;color:var(--fg2)">Fission-based electricity generation.</span></div>
    <div class="line"><span class="tag">Label · 12/500 ↑</span><span style="font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--fg3)">Positions</span></div>
  </div>
</body></html>
