<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:#fff;padding:0}
  .bar{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--ink-100)}
  .logo{font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--fg1)}
  .search{flex:1;display:flex;align-items:center;gap:8px;background:var(--ink-50);border:1px solid var(--ink-100);border-radius:9999px;padding:8px 14px;color:var(--fg3);font-size:14px}
  .menu{display:flex;flex-direction:column;gap:3px}
  .menu span{display:block;width:18px;height:1.5px;background:var(--fg2);border-radius:2px}
  .drop{margin:10px 22px 22px;border:1px solid var(--ink-100);border-radius:12px;box-shadow:0 4px 16px -4px rgba(26,26,24,.12);overflow:hidden}
  .opt{padding:10px 14px;font-size:14px;color:var(--fg1);display:flex;justify-content:space-between;align-items:center}
  .opt+.opt{border-top:1px solid var(--ink-100)}
  .opt .k{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em}
  .opt.on{background:var(--ink-50)}
</style></head>
<body>
  <div class="bar">
    <div class="logo">Infinity</div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <span>nucl</span>
    </div>
    <div class="menu"><span></span><span></span><span></span></div>
  </div>
  <div class="drop">
    <div class="opt on"><span>Nuclear Energy</span><span class="k">Topic</span></div>
    <div class="opt"><span>Nuclear Weapons</span><span class="k">Topic</span></div>
    <div class="opt"><span>Energy &amp; Environment</span><span class="k">Category</span></div>
  </div>
</body></html>
