<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:#fff;padding:22px 24px}
  .grp{margin-bottom:18px}
  .h{font-size:11px;color:var(--fg3);margin:0 0 10px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;font-size:12px;font-weight:500;border-radius:9999px;padding:5px 12px}
  .cat{color:var(--fg2);background:var(--ink-100)}
  .rel{color:var(--fg2);background:#fff;border:1px solid var(--ink-100)}
</style></head>
<body>
  <div class="grp">
    <p class="h">Category badge — filled</p>
    <div class="row">
      <span class="chip cat">Energy &amp; Environment</span>
      <span class="chip cat">Technology</span>
    </div>
  </div>
  <div class="grp" style="margin-bottom:0">
    <p class="h">Related-topic chip — outlined, hover lifts border to ink-200</p>
    <div class="row">
      <span class="chip rel">Solar Power</span>
      <span class="chip rel">Grid Storage</span>
      <span class="chip rel">Carbon Pricing</span>
    </div>
  </div>
</body></html>
