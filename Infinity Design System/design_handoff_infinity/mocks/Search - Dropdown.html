<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Search — Infinity</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--ink-50);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;color:var(--ink-900);min-height:100vh}
  a{color:inherit;text-decoration:none}

  /* dim backdrop so the dropdown reads as a focused overlay */
  .page{filter:saturate(.96)}
  .scrim{position:fixed;inset:0;background:rgba(20,22,15,.18);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.on{opacity:1}

  .nav{position:sticky;top:0;z-index:40;background:rgba(247,249,247,.92);backdrop-filter:saturate(1.3) blur(9px);border-bottom:1px solid var(--ink-100)}
  .nav-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:14px 32px}
  .logo{display:flex;align-items:center;gap:10px}
  .logo .mark{width:27px;height:27px;border-radius:7px;display:block}
  .logo .wm{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.03em}
  .search-wrap{flex:1;max-width:520px;margin:0 auto;position:relative;z-index:50}
  .search{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--ink-100);border-radius:16px;padding:12px 16px;color:var(--ink-900);font-size:15px;box-shadow:0 1px 2px rgba(20,22,15,.04)}
  .search.focus{border-color:color-mix(in srgb,var(--green-500) 55%,var(--ink-100));box-shadow:0 0 0 4px var(--green-tint)}
  .search i.lead{font-size:18px;color:var(--ink-400)}
  .search input{all:unset;flex:1;font-family:var(--font-sans);font-size:15px;color:var(--ink-900)}
  .search input::placeholder{color:var(--ink-400)}
  .search .clear{width:24px;height:24px;border-radius:9999px;background:var(--ink-50);display:none;align-items:center;justify-content:center;color:var(--ink-400);cursor:pointer}
  .search .clear i{font-size:13px}
  .search.has .clear{display:flex}
  .nav-ico{width:38px;height:38px;border-radius:9999px;background:#fff;border:1px solid var(--ink-100);display:flex;align-items:center;justify-content:center;color:var(--ink-600)}
  .nav-ico i{font-size:19px}

  /* dropdown */
  .dd{position:absolute;top:calc(100% + 9px);left:0;right:0;background:#fff;border:1px solid var(--ink-100);border-radius:18px;box-shadow:0 24px 50px -18px rgba(20,22,15,.28);overflow:hidden;max-height:560px;overflow-y:auto;display:none}
  .dd.on{display:block}
  .dd::-webkit-scrollbar{width:0}
  .grp{padding:8px 8px 10px}
  .grp + .grp{border-top:1px solid var(--ink-100)}
  .grp-h{display:flex;align-items:center;gap:8px;padding:9px 12px 7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400)}
  .grp-h .gc{margin-left:auto;font-weight:700;color:var(--ink-300);letter-spacing:0;text-transform:none;font-size:12px}

  .row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:11px;cursor:pointer}
  .row:hover,.row.cur{background:var(--ink-50)}
  .row .ri{flex:none;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
  .row .ri i{font-size:20px}
  .row .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .row .rn{font-family:var(--font-display);font-weight:700;font-size:15.5px;letter-spacing:-.01em;color:var(--ink-900);line-height:1.2}
  .row .rn mark{background:var(--green-tint);color:var(--green-800,inherit);border-radius:3px;padding:0 1px}
  .row .rd{font-size:12.5px;color:var(--ink-500);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .rk{flex:none;font-size:11px;font-weight:600;color:var(--ink-400);background:var(--ink-50);border:1px solid var(--ink-100);border-radius:7px;padding:3px 8px}
  .row .rdots{flex:none;display:flex;gap:4px}
  .row .rdots span{width:8px;height:8px;border-radius:9999px}
  .row .rarr{flex:none;color:var(--ink-300);font-size:15px;opacity:0}
  .row:hover .rarr,.row.cur .rarr{opacity:1}

  /* topic row icon tint by category; position row uses position color */
  .ri.cat-energy{background:var(--cat-energy-tint);color:var(--cat-energy)}
  .ri.cat-tech{background:var(--cat-tech-tint);color:var(--cat-tech)}
  .ri.cat-econ{background:var(--cat-econ-tint);color:var(--cat-econ)}
  .ri.cat-ethics{background:var(--cat-ethics-tint);color:var(--cat-ethics)}
  .ri.cat-risk{background:var(--cat-risk-tint);color:var(--cat-risk)}
  .ri.cat-gov{background:var(--cat-gov-tint);color:var(--cat-gov)}
  .ri.catbig{border-radius:11px}
  .ri.pos{background:var(--ink-50)}

  .empty{padding:30px 20px 34px;text-align:center}
  .empty i{font-size:30px;color:var(--ink-300)}
  .empty p{margin:10px 0 0;font-size:14px;color:var(--ink-500)}
  .empty b{color:var(--ink-800);font-weight:600}

  .ddfoot{display:flex;align-items:center;gap:16px;padding:11px 18px;border-top:1px solid var(--ink-100);background:var(--ink-50);font-size:12px;color:var(--ink-400)}
  .ddfoot .kbd{display:inline-flex;align-items:center;gap:5px}
  .ddfoot .kbd b{font-family:var(--font-sans);font-weight:700;color:var(--ink-500);background:#fff;border:1px solid var(--ink-100);border-radius:5px;padding:1px 6px;font-size:11px}
  .ddfoot .seeall{margin-left:auto;font-weight:600;color:var(--green-700);cursor:pointer}

  /* page body behind */
  .hint{max-width:1180px;margin:60px auto;padding:0 32px;text-align:center;color:var(--ink-400)}
  .hint h2{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.02em;color:var(--ink-300);margin:0}
  .hint p{margin:10px 0 0;font-size:14px}
</style>
</head>
<body data-screen-label="Search — results dropdown">
  <div class="scrim" id="scrim"></div>
  <div class="page">
    <div class="nav">
      <div class="nav-in">
        <a class="logo"><img class="mark" src="assets/infinity-mark.png" alt="" /><span class="wm">Infinity</span></a>
        <div class="search-wrap">
          <div class="search has focus" id="searchbox">
            <i class="ph-duotone ph-magnifying-glass lead"></i>
            <input id="q" type="text" placeholder="Search topics and categories" value="nuc" autocomplete="off" />
            <span class="clear" id="clear"><i class="ph-bold ph-x"></i></span>
          </div>
          <div class="dd on" id="dd"></div>
        </div>
        <span class="nav-ico"><i class="ph-duotone ph-list"></i></span>
      </div>
    </div>
    <div class="hint">
      <h2>Type in the search box</h2>
      <p>Results appear instantly — topics, categories, positions, and suggestions. Try “nuclear”, “cost”, “energy”, or clear it.</p>
    </div>
  </div>

  <script>
    var TOPICS=[
      {n:'Nuclear Energy',cat:'energy',icon:'atom',desc:'Energy & Environment · 4 positions',dots:['--pos-green','--pos-amber','--pos-blue','--pos-rust']},
      {n:'Nuclear Weapons',cat:'risk',icon:'globe-hemisphere-west',desc:'Existential & Global Risk · 4 positions',dots:['--pos-rust','--pos-slate','--pos-blue','--pos-amber']},
      {n:'Solar Power',cat:'energy',icon:'sun',desc:'Energy & Environment · 3 positions',dots:['--pos-green','--pos-blue','--pos-slate']},
      {n:'Carbon Pricing',cat:'energy',icon:'gas-pump',desc:'Energy & Environment · 4 positions',dots:['--pos-blue','--pos-amber','--pos-rust','--pos-purple']},
      {n:'Grid Storage',cat:'energy',icon:'battery-charging',desc:'Energy & Environment · 3 positions',dots:['--pos-green','--pos-slate','--pos-blue']},
      {n:'AI Existential Risk',cat:'tech',icon:'brain',desc:'AI & Technology · 4 positions',dots:['--pos-rust','--pos-blue','--pos-amber','--pos-green']},
      {n:'AI Governance',cat:'tech',icon:'gavel',desc:'AI & Technology · 3 positions',dots:['--pos-blue','--pos-amber','--pos-slate']},
      {n:'Housing Affordability',cat:'econ',icon:'house-line',desc:'Economic & Social · 3 positions',dots:['--pos-blue','--pos-amber','--pos-slate']},
      {n:'Universal Basic Income',cat:'econ',icon:'hand-coins',desc:'Economic & Social · 3 positions',dots:['--pos-green','--pos-amber','--pos-rust']},
      {n:'Free Will',cat:'ethics',icon:'brain-circuit',desc:'Ethics & Philosophy · 3 positions',dots:['--pos-purple','--pos-teal','--pos-slate']}
    ];
    var CATS=[
      {n:'Energy & Environment',cat:'energy',icon:'leaf',desc:'12 topics'},
      {n:'AI & Technology',cat:'tech',icon:'cpu',desc:'9 topics'},
      {n:'Economic & Social',cat:'econ',icon:'trend-up',desc:'10 topics'},
      {n:'Ethics & Philosophy',cat:'ethics',icon:'scales',desc:'8 topics'},
      {n:'Existential & Global Risk',cat:'risk',icon:'globe-hemisphere-west',desc:'7 topics'}
    ];
    var POSITIONS=[
      {n:'Cost Skeptic',topic:'Nuclear Energy',color:'--pos-amber'},
      {n:'Climate Pragmatist',topic:'Nuclear Energy',color:'--pos-green'},
      {n:'New-Nuclear Advocate',topic:'Nuclear Energy',color:'--pos-blue'},
      {n:'Risk-First Skeptic',topic:'Nuclear Energy',color:'--pos-rust'}
    ];

    var q=document.getElementById('q'),dd=document.getElementById('dd'),box=document.getElementById('searchbox'),scrim=document.getElementById('scrim'),clear=document.getElementById('clear');
    function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
    function hl(name,term){if(!term)return esc(name);var i=name.toLowerCase().indexOf(term.toLowerCase());if(i<0)return esc(name);return esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+term.length))+'</mark>'+esc(name.slice(i+term.length))}
    function dotsHTML(arr){return '<span class="rdots">'+arr.map(function(c){return '<span style="background:var('+c+')"></span>'}).join('')+'</span>'}

    function topicRow(t,term){return '<a class="row"><span class="ri cat-'+t.cat+'"><i class="ph-duotone ph-'+t.icon+'"></i></span><span class="rt"><span class="rn">'+hl(t.n,term)+'</span><span class="rd">'+t.desc+'</span></span>'+dotsHTML(t.dots)+'<i class="ph-bold ph-arrow-right rarr"></i></a>'}
    function catRow(c,term){return '<a class="row"><span class="ri catbig cat-'+c.cat+'"><i class="ph-duotone ph-'+c.icon+'"></i></span><span class="rt"><span class="rn">'+hl(c.n,term)+'</span><span class="rd">'+c.desc+'</span></span><span class="rk">Category</span><i class="ph-bold ph-arrow-right rarr"></i></a>'}
    function posRow(p,term){return '<a class="row"><span class="ri pos" style="color:var('+p.color+')"><i class="ph-fill ph-circle" style="font-size:15px"></i></span><span class="rt"><span class="rn">'+hl(p.n,term)+'</span><span class="rd">Position in '+p.topic+'</span></span><span class="rk">Position</span><i class="ph-bold ph-arrow-right rarr"></i></a>'}

    function render(){
      var term=q.value.trim();
      box.classList.toggle('has',term.length>0);
      if(!term){
        // empty state — suggested
        var sugg=[TOPICS[0],TOPICS[5],TOPICS[7]];
        dd.innerHTML=
          '<div class="grp"><div class="grp-h">Suggested topics</div>'+sugg.map(function(t){return topicRow(t,'')}).join('')+'</div>'+
          '<div class="grp"><div class="grp-h">Browse by category</div>'+CATS.slice(0,3).map(function(c){return catRow(c,'')}).join('')+'</div>'+
          foot();
        wire();return;
      }
      var tl=term.toLowerCase();
      var mt=TOPICS.filter(function(t){return t.n.toLowerCase().includes(tl)});
      var mc=CATS.filter(function(c){return c.n.toLowerCase().includes(tl)});
      var mp=POSITIONS.filter(function(p){return p.n.toLowerCase().includes(tl)});
      var html='';
      if(mt.length)html+='<div class="grp"><div class="grp-h">Topics<span class="gc">'+mt.length+'</span></div>'+mt.map(function(t){return topicRow(t,term)}).join('')+'</div>';
      if(mc.length)html+='<div class="grp"><div class="grp-h">Categories<span class="gc">'+mc.length+'</span></div>'+mc.map(function(c){return catRow(c,term)}).join('')+'</div>';
      if(mp.length)html+='<div class="grp"><div class="grp-h">Positions<span class="gc">'+mp.length+'</span></div>'+mp.map(function(p){return posRow(p,term)}).join('')+'</div>';
      if(!html){
        // no match — suggest related
        var rel=TOPICS.slice(0,3);
        html='<div class="empty"><i class="ph-duotone ph-binoculars"></i><p>No exact match for <b>“'+esc(term)+'”</b></p></div>'+
          '<div class="grp"><div class="grp-h">You might mean</div>'+rel.map(function(t){return topicRow(t,'')}).join('')+'</div>';
      }
      dd.innerHTML=html+foot();
      wire();
    }
    function foot(){return '<div class="ddfoot"><span class="kbd"><b>↑</b><b>↓</b> navigate</span><span class="kbd"><b>↵</b> open</span><span class="kbd"><b>esc</b> close</span><span class="seeall">See all results →</span></div>'}
    function wire(){
      var rows=[].slice.call(dd.querySelectorAll('.row'));
      rows.forEach(function(r){r.addEventListener('mouseenter',function(){rows.forEach(function(x){x.classList.remove('cur')});r.classList.add('cur')})});
    }
    q.addEventListener('input',render);
    q.addEventListener('focus',function(){box.classList.add('focus');dd.classList.add('on');scrim.classList.add('on')});
    function close(){dd.classList.remove('on');scrim.classList.remove('on');box.classList.remove('focus')}
    scrim.addEventListener('click',close);
    clear.addEventListener('click',function(){q.value='';render();q.focus()});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
    // keyboard up/down
    document.addEventListener('keydown',function(e){
      if(!dd.classList.contains('on'))return;
      var rows=[].slice.call(dd.querySelectorAll('.row'));if(!rows.length)return;
      var i=rows.findIndex(function(r){return r.classList.contains('cur')});
      if(e.key==='ArrowDown'){e.preventDefault();i=Math.min(rows.length-1,i+1);}
      else if(e.key==='ArrowUp'){e.preventDefault();i=Math.max(0,i-1);}
      else return;
      rows.forEach(function(x){x.classList.remove('cur')});rows[i].classList.add('cur');
    });
    render();
  </script>
</body>
</html>
